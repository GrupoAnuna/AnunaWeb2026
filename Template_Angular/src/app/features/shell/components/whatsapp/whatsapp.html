<!-- Botón flotante: fijo en la esquina inferior derecha en todas las páginas -->
<button type="button" (click)="open()" aria-haspopup="dialog" aria-controls="wa-dialog"
  class="wa-fab fixed z-50 flex h-16 w-16 items-center justify-center rounded-full bg-[#25D366] text-white shadow-anuna-lg focus:outline-none focus-visible:ring-4 focus-visible:ring-[#25D366]/40">
  <span class="wa-ring absolute inset-0 rounded-full bg-[#25D366]" aria-hidden="true"></span>
  <svg class="relative h-8 w-8" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M12.04 2a9.9 9.9 0 0 0-8.5 15l-1.4 5 5.1-1.34A9.9 9.9 0 1 0 12.04 2zm0 18.1a8.2 8.2 0 0 1-4.2-1.15l-.3-.18-3.03.8.81-2.95-.2-.3a8.2 8.2 0 1 1 6.92 3.78zm4.5-6.14c-.25-.12-1.46-.72-1.69-.8-.23-.08-.39-.12-.55.12-.16.25-.63.8-.78.97-.14.16-.29.18-.53.06a6.7 6.7 0 0 1-3.34-2.92c-.25-.43.25-.4.72-1.34.08-.16.04-.3-.02-.43-.06-.12-.55-1.33-.76-1.82-.2-.48-.4-.41-.55-.42h-.47a.9.9 0 0 0-.65.3 2.73 2.73 0 0 0-.85 2.03 4.74 4.74 0 0 0 1 2.52 10.86 10.86 0 0 0 4.16 3.67c1.55.67 2.16.73 2.93.61.47-.07 1.46-.6 1.66-1.17.2-.58.2-1.07.14-1.17-.06-.1-.22-.16-.47-.28z" />
  </svg>
  <span class="sr-only">Escríbenos por WhatsApp</span>
</button>

<!-- Modal "Elige tu zona": hoja que sube desde abajo -->
<dialog #dialog id="wa-dialog" class="wa-sheet" aria-labelledby="wa-title" aria-describedby="wa-desc"
  (cancel)="onCancel($event)" (click)="onBackdropClick($event)">
  <div class="sheet-inner mx-auto w-full max-w-content px-5 pb-8 pt-3 sm:px-8 sm:pb-10">

    <!-- Asa (indicador visual de hoja deslizable) -->
    <span class="mx-auto mb-5 block h-1.5 w-12 rounded-full bg-anuna-line" aria-hidden="true"></span>

    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 id="wa-title" class="text-2xl font-bold text-anuna-slate sm:text-[1.75rem]">Elige tu zona</h2>
        <p id="wa-desc" class="mt-2 text-[15px] text-anuna-gray">Selecciona dónde quieres que te atendamos por WhatsApp.</p>
      </div>
      <button type="button" (click)="close()" aria-label="Cerrar"
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-anuna-slate transition-colors hover:bg-anuna-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-anuna-slate">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </div>

    <ul class="mt-6 grid gap-3 sm:grid-cols-2 sm:gap-4">
      @for (z of zones; track z.id; let i = $index) {
        <li class="zone-item" [style.--k]="i">
          <a [href]="z.url" target="_blank" rel="noopener" (click)="close()"
            class="zone group flex items-center gap-4 rounded-2xl border-2 border-anuna-yellow/60 bg-white px-5 py-4 transition duration-200 hover:border-[#25D366] hover:shadow-anuna-md focus:outline-none focus-visible:ring-2 focus-visible:ring-anuna-slate focus-visible:ring-offset-2">
            <!-- Bandera en SVG (los emojis de banderas no se ven en Windows) -->
            <span class="flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-full bg-anuna-cream ring-1 ring-anuna-line" aria-hidden="true">
              @if (z.id === 'es') {
                <svg viewBox="0 0 30 30" class="h-full w-full"><rect width="30" height="30" fill="#AA151B" /><rect y="7.5" width="30" height="15" fill="#F1BF00" /></svg>
              } @else {
                <svg viewBox="0 0 24 24" class="h-6 w-6 text-anuna-slate" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" /></svg>
              }
            </span>
            <span class="flex-1">
              <span class="block text-lg font-bold text-anuna-slate">{{ z.label }}</span>
              <span class="block text-[15px] tabular-nums text-anuna-gray">{{ z.display }}</span>
            </span>
            <span class="go flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#25D366] text-white" aria-hidden="true">
              <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </span>
            <span class="sr-only">(abre WhatsApp en una pestaña nueva)</span>
          </a>
        </li>
      }
    </ul>
  </div>
</dialog>
