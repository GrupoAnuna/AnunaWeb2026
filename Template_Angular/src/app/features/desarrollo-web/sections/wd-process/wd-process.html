<section class="bg-anuna-cream py-20 lg:py-28" aria-labelledby="wd-process-title">
  <div class="mx-auto max-w-content px-5 sm:px-8">

    <div class="max-w-2xl">
      <p appReveal class="reveal mb-5 text-[15px] font-bold text-anuna-orange-700">Proceso de trabajo</p>
      <h2 id="wd-process-title" appReveal style="--d:80ms"
        class="reveal text-3xl font-bold leading-tight tracking-[-0.015em] text-anuna-slate sm:text-4xl lg:text-[2.75rem]">
        Cuatro pasos, cero sorpresas
      </h2>
      <p appReveal style="--d:160ms" class="reveal mt-5 text-lg leading-relaxed text-anuna-gray">
        Sabes en todo momento en qué etapa está tu proyecto y qué vas a recibir al terminar cada una.
      </p>
    </div>

    <!-- Circuito de pasos: vertical en móvil, horizontal en escritorio -->
    <div appReveal class="flow-steps relative mt-14 lg:mt-16">
      <div class="absolute bottom-10 left-[21px] top-5 w-[3px] rounded-full bg-anuna-line lg:bottom-auto lg:left-[22px] lg:right-[22px] lg:top-[21px] lg:h-[3px] lg:w-auto" aria-hidden="true">
        <div class="flow-line absolute inset-0 rounded-full bg-anuna-slate"></div>
        <span class="flow-pulse absolute left-1/2 top-0 h-3 w-3 -translate-x-1/2 -translate-y-1/2 rounded-full bg-anuna-orange lg:left-0 lg:top-1/2"></span>
      </div>

      <ol class="relative grid gap-10 lg:grid-cols-4 lg:gap-8">
        @for (s of steps; track s.title; let i = $index) {
          <li class="step relative pl-16 lg:pl-0 lg:pt-20" [style.--d]="300 + i * 480 + 'ms'">
            <span class="step-node absolute left-0 top-0 flex h-[45px] w-[45px] items-center justify-center rounded-full border-[3px] border-anuna-slate bg-anuna-cream text-base font-bold text-anuna-slate" aria-hidden="true">
              {{ i + 1 }}
            </span>
            <div class="step-body">
              <h3 class="text-xl font-bold text-anuna-slate">{{ s.title }}</h3>
              <p class="mt-2 text-[15px] leading-relaxed text-anuna-gray">{{ s.text }}</p>
              <p class="mt-4 inline-flex items-center gap-2 rounded-full border border-anuna-line bg-white px-3 py-1.5 text-xs font-bold text-anuna-slate">
                <span class="h-1.5 w-1.5 rounded-full bg-anuna-orange" aria-hidden="true"></span>
                <span class="sr-only">Entregable:</span>{{ s.deliverable }}
              </p>
            </div>
          </li>
        }
      </ol>
    </div>
  </div>
</section>
