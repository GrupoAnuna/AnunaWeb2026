<section class="relative overflow-clip bg-white py-20 lg:py-28" aria-labelledby="ia-trust-title">
  <div class="mx-auto max-w-content px-5 sm:px-8">
    <div appReveal class="reveal trust relative overflow-hidden rounded-[32px] bg-anuna-slate p-8 text-anuna-cream sm:p-12">
      <!-- Isotipo gigante de fondo -->
      <svg class="wm pointer-events-none absolute -bottom-16 -right-10 h-[360px] w-auto opacity-[.07]" viewBox="0 0 100 130" aria-hidden="true">
        <path d="M14 130 V50 A36 36 0 0 1 86 50 V130" fill="none" stroke="#FDF6EC" stroke-width="28" />
      </svg>

      <div class="relative max-w-2xl">
        <p class="mb-5 text-[15px] font-bold text-anuna-yellow">IA responsable</p>
        <h2 id="ia-trust-title" class="text-3xl font-bold leading-tight tracking-[-0.015em] text-white sm:text-4xl">
          Tecnología potente, con reglas claras
        </h2>
        <p class="mt-4 text-lg leading-relaxed text-anuna-cream/85">
          La IA es una herramienta, no una caja negra. Así la usamos contigo:
        </p>
      </div>

      <ul class="relative mt-10 grid gap-5 md:grid-cols-3">
        @for (p of principles; track p.title; let i = $index) {
          <li class="principle rounded-[22px] border border-white/10 bg-white/[.05] p-6" [style.--k]="i">
            <span class="badge relative flex h-14 w-14 items-center justify-center rounded-2xl bg-anuna-yellow text-anuna-slate-900">
              <app-icon [name]="p.icon" class="h-6 w-6" />
              <span class="badge-check absolute -right-2 -top-2 flex h-6 w-6 items-center justify-center rounded-full bg-anuna-orange text-anuna-ink ring-4 ring-anuna-slate">
                <app-icon name="check" class="h-3 w-3" />
              </span>
            </span>
            <h3 class="mt-5 text-lg font-bold text-white">{{ p.title }}</h3>
            <p class="mt-2 text-[15px] leading-relaxed text-anuna-cream/80">{{ p.text }}</p>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
