<section class="bg-anuna-cream py-20 lg:py-28" aria-labelledby="cy-layers-title">
  <div class="mx-auto max-w-content px-5 sm:px-8">

    <div class="grid gap-6 lg:grid-cols-[1fr_1fr] lg:items-end">
      <div>
        <p appReveal class="reveal mb-5 text-[15px] font-bold text-anuna-orange-700">Qué hacemos</p>
        <h2 id="cy-layers-title" appReveal style="--d:80ms"
          class="reveal max-w-lg text-3xl font-bold leading-tight tracking-[-0.015em] text-anuna-slate sm:text-4xl lg:text-[2.75rem]">
          Protección en capas, como una cebolla
        </h2>
      </div>
      <p appReveal style="--d:160ms" class="reveal max-w-md text-lg leading-relaxed text-anuna-gray lg:justify-self-end">
        Ninguna herramienta es infalible por sí sola. Por eso sumamos varias capas: si una falla, la siguiente te sigue cuidando.
      </p>
    </div>

    <div class="mt-14 grid items-center gap-10 lg:grid-cols-[1fr_1fr] lg:gap-16">

      <!-- Anillos -->
      <div appReveal class="reveal rings-wrap" style="--d:120ms" aria-hidden="true">
        <svg viewBox="0 0 400 400" class="mx-auto w-full max-w-[460px]">
          @for (r of radii; track r; let i = $index) {
            <circle class="ring" [class.on]="active() === i" cx="200" cy="200" [attr.r]="r" fill="none" stroke-width="20"
              pathLength="1" [style.--k]="radii.length - 1 - i" (click)="select(i)" />
          }
          <!-- Núcleo -->
          <circle cx="200" cy="200" r="44" fill="#2E434A" />
          <g transform="translate(184 168)">
            <path d="M16 3 6 7v6c0 6 4 11 10 13 6-2 10-7 10-13V7Z" fill="#FFD97D" />
          </g>
          <text x="200" y="218" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FDF6EC" font-family="DM Sans, system-ui, sans-serif">Tu</text>
          <text x="200" y="228" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FDF6EC" font-family="DM Sans, system-ui, sans-serif">información</text>

          <!-- Número de cada capa -->
          @for (r of radii; track r; let i = $index) {
            <g class="badge" [class.on]="active() === i" (click)="select(i)">
              <circle [attr.cx]="badge(i).x" [attr.cy]="badge(i).y" r="13" />
              <text [attr.x]="badge(i).x" [attr.y]="badge(i).y + 4.5" text-anchor="middle" font-size="12" font-weight="700" font-family="DM Sans, system-ui, sans-serif">{{ i + 1 }}</text>
            </g>
          }

          <!-- Una "amenaza" que rebota contra la capa activa -->
          <circle class="attacker" cx="30" cy="370" r="6" fill="#FF6B35" />
        </svg>
      </div>

      <!-- Lista de capas -->
      <ol appReveal class="reveal space-y-3" style="--d:220ms">
        @for (l of layers; track l.title; let i = $index) {
          <li>
            <button type="button" (click)="select(i)" (focus)="select(i)" [attr.aria-pressed]="active() === i"
              class="layer flex w-full items-start gap-4 rounded-[20px] border-2 p-5 text-left transition duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-anuna-orange focus-visible:ring-offset-2 focus-visible:ring-offset-anuna-cream"
              [class.on]="active() === i">
              <span class="num flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-sm font-bold">{{ i + 1 }}</span>
              <span class="flex-1">
                <span class="flex items-center gap-2 text-lg font-bold text-anuna-slate">
                  <app-icon [name]="l.icon" class="h-5 w-5 text-anuna-orange-700" /> {{ l.title }}
                </span>
                <span class="text-wrap mt-1 block text-[15px] leading-relaxed text-anuna-gray">{{ l.text }}</span>
              </span>
            </button>
          </li>
        }
      </ol>
    </div>
  </div>
</section>
