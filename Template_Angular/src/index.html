<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Grupo Anuna</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Activa las animaciones antes del primer pintado (evita parpadeos).
       Si el usuario pidió "reducir movimiento", no se activa. -->
  <script>
    (function () {
      var root = document.documentElement;
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('anim');

      // Modo oscuro ANTES del primer pintado (evita el destello claro):
      // 1) la elección guardada; 2) si no hay, la preferencia del sistema.
      var theme = null;
      try { theme = localStorage.getItem('anuna-theme'); } catch (e) {}
      if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) root.classList.add('dark');

      // Idioma: la elección guardada o, si no hay, el idioma del navegador.
      var lang = null;
      try { lang = localStorage.getItem('anuna-lang'); } catch (e) {}
      if (!lang) {
        var langs = navigator.languages || [navigator.language || 'es'];
        for (var i = 0; i < langs.length; i++) {
          var l = String(langs[i]).toLowerCase();
          if (l.indexOf('es') === 0) { lang = 'es'; break; }
          if (l.indexOf('en') === 0) { lang = 'en'; break; }
        }
      }
      root.lang = lang === 'en' ? 'en' : 'es';
    })();
  </script>

  <!-- Tipografía oficial: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
</head>
<body class="bg-page font-sans text-anuna-gray">
  <app-root></app-root>
</body>
</html>
